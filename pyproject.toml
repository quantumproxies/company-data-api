[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-company-data-api"
version = "0.1.0"
description = "Company data API for Python and the command line: one structured company record from a domain, with name, legal name, description, industry, headquarters, office addresses, emails, phones, social profiles, logo and VAT number, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["company-data-api", "company-data", "company-information-api", "business-data-api", "company-enrichment", "data-enrichment", "firmographics", "domain-to-company", "b2b-data", "lead-generation", "web-scraping", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
company-data = "quanticdata_company_data_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/company-data-api/?utm_source=github&utm_medium=pypi&utm_campaign=company-data-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/company-data-api"
Issues = "https://github.com/quantumproxies/company-data-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_company_data_api" = ["spec.json", "py.typed"]
